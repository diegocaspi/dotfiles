# --- Window Settings ---
[window]
# Adds a bit of breathing room around the text
padding = { x = 8, y = 8 }
# opacity = 0.95 # Uncomment to make the background slightly transparent

# --- Font Settings ---
[font]
# Incremented font size
size = 14.0

[font.normal]
# Make sure this exactly matches the name of the installed Nerd Font on your OS
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

# --- Color Scheme (Catppuccin Mocha) ---
[colors.primary]
background = "#1E1E2E"
foreground = "#CDD6F4"
dim_foreground = "#CDD6F4"
bright_foreground = "#CDD6F4"

[colors.cursor]
cursor = "#F5E0DC"
text = "#1E1E2E"

[colors.vi_mode_cursor]
